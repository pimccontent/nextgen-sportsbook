    <circle cx="46" cy="46" r="14" fill="url(#chip)"/>
    <text x="78" y="42" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Kotoko</text>
    <text x="78" y="68" fill="#F5A524" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">2.15</text>
    <text x="340" y="58" fill="#FFFFFF" fill-opacity="0.55" font-family="Segoe UI, sans-serif" font-size="14">1</text>
  </g>
  <g transform="translate(1000 270)">
    <rect width="420" height="92" rx="18" fill="#0F1A16" stroke="#F5A524" stroke-opacity="0.4" stroke-width="2"/>
