    <text x="78" y="42" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Pyunik</text>
    <text x="78" y="68" fill="#F5A524" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">1.92</text>
