<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1218"/>
      <stop offset="0.5" stop-color="#0C241F"/>
      <stop offset="1" stop-color="#1C1408"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(280 160) rotate(80) scale(520 420)">
      <stop stop-color="#F5A524" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5A524"/>
      <stop offset="1" stop-color="#D4891A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#glow)"/>
  <!-- stacked selection cards -->
  <g transform="translate(980 150)">
    <rect x="40" y="40" width="420" height="92" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
